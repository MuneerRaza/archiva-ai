<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archiva - AI-Powered Document Management</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0b;
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        .logo {
            display: inline-flex;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }
        .tagline {
            font-size: 1.125rem;
            color: #a1a1aa;
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }
        .cta {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.75rem;
            background: #3b82f6;
            color: #fff;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9375rem;
            transition: background 0.2s;
        }
        .cta:hover { background: #2563eb; }
        .links {
            margin-top: 3rem;
            display: flex;
            gap: 2rem;
            justify-content: center;
        }
        .links a {
            color: #71717a;
            text-decoration: none;
            font-size: 0.8125rem;
            transition: color 0.2s;
        }
        .links a:hover { color: #e4e4e7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 32 32" fill="none" width="48" height="48">
                <rect x="6" y="8" width="14" height="14" rx="3" fill="#f97316" fill-opacity="0.6" transform="rotate(-15 13 15)" />
                <rect x="9" y="6" width="14" height="14" rx="3" fill="#a855f7" fill-opacity="0.5" transform="rotate(6 16 13)" />
                <rect x="12" y="10" width="14" height="14" rx="3" fill="#3b82f6" fill-opacity="0.6" transform="rotate(22 19 17)" />
            </svg>
        </div>
        <h1>Archiva</h1>
        <p class="tagline">
            AI-powered document management. Upload your files, and let an intelligent agent
            reason over your organizational knowledge.
        </p>
        <div class="links">
            <a href="privacy/">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
