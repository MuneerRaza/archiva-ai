[project]
name = "archiva-backend"
version = "0.1.0"
description = "Archiva.ai — AI-powered CMS backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "boto3>=1.36.0",
    "pyjwt[crypto]>=2.10.0",
    "python-jose[cryptography]>=3.5.0",
    "aiofiles>=25.1.0",
    "pymupdf>=1.27.1",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pymupdf4llm>=0.0.17",
    "pydantic-ai>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # ruff-specific
    "PIE",   # flake8-pie
    "T20",   # flake8-print (no print statements)
    "RET",   # flake8-return
    "PTH",   # flake8-use-pathlib
]
ignore = [
    "RET504",  # unnecessary assignment before return
    "B008",    # function calls in argument defaults (FastAPI Depends/Query/Path/File/Form)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
